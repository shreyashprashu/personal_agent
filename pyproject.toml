[project]
name = "personal-agent"
version = "0.2.0"
description = "Personal AI research assistant API"
readme = "README.md"
authors = [
    { name = "shreyashprashu", email = "shreyashprashu93@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain-core>=1.7.0",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.17",
    "pydantic-settings>=2.16.1",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
