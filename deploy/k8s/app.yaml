apiVersion: v1
kind: Namespace
metadata:
  name: personal-agent
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: personal-agent-config
  namespace: personal-agent
data:
  AZURE_AI_PROJECT_ENDPOINT: ""
  AZURE_AI_DEPLOYMENT_NAME: ""
  AZURE_SPEECH_REGION: ""
  AZURE_SPEECH_VOICE: "en-US-JennyNeural"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: personal-agent
  namespace: personal-agent
  labels:
    app.kubernetes.io/name: personal-agent
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: personal-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: personal-agent
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: personal-agent:0.2.0
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: personal-agent-config
            - secretRef:
                name: personal-agent-runtime
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 18
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
            failureThreshold: 3
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: personal-agent
  namespace: personal-agent
  labels:
    app.kubernetes.io/name: personal-agent
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: personal-agent
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
